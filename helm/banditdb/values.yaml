# BanditDB Helm Chart — default values
# Override with: helm install banditdb . -f my-values.yaml

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: banditdb
  tag: "2.0.0"
  pullPolicy: IfNotPresent
  # pullSecrets: [{ name: regcred }]

replicaCount: 1  # BanditDB is single-writer; always keep at 1

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP   # Use LoadBalancer to expose externally
  port: 8080
  annotations: {}

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: banditdb.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - hosts: [banditdb.example.com]
  #   secretName: banditdb-tls

# ── Persistence ───────────────────────────────────────────────────────────────
persistence:
  enabled: true
  # storageClass: "" # leave empty for cluster default
  accessMode: ReadWriteOnce
  size: 10Gi
  # existingClaim: ""

# ── Authentication ────────────────────────────────────────────────────────────
# Stored in a Kubernetes Secret. Fill exactly ONE of:
auth:
  # Multi-key RBAC (recommended):
  #   "key1=admin;key2=writer;key3=reader"
  # With tenants:
  #   "key1=admin;key2=admin:tenant_a;key3=writer:tenant_b"
  apiKeys: ""
  # Legacy single admin key (backward compat):
  apiKey: ""
  # Refuse to start when no keys are configured. Without keys every caller is
  # granted admin, so a missing secret would otherwise publish an open database.
  # Leave true for any deployment; set false only for a throwaway local install.
  required: true

# ── Multi-tenancy ──────────────────────────────────────────────────────────────
# Logical isolation only — a tenant prefix on campaign ids, enforced on every
# route. It is not a hard boundary between mutually hostile tenants, and there is
# no cap on how many campaigns one tenant may create. Pool only tenants you trust.
tenantMode: false

# ── Metrics ───────────────────────────────────────────────────────────────────
metrics:
  # /metrics requires a reader key by default, because its output names campaigns
  # and arms — in tenant mode that is the customer list.
  #
  # Prometheus cannot send that key. ServiceMonitor supports basicAuth, bearer
  # tokens, oauth2 and TLS, but not an arbitrary X-Api-Key header, and the server
  # reads only that header. So scraping requires opening the endpoint:
  #
  #   config.metricsPublic: true
  #
  # Pair it with networkPolicy below so "public" means "reachable by the
  # monitoring namespace", not "reachable by every pod in the cluster".
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels so a Prometheus configured with a selector picks this up.
    additionalLabels: {}
    # Namespace to create the ServiceMonitor in (default: the release namespace).
    namespace: ""

# ── Network policy ────────────────────────────────────────────────────────────
# Restricts who may open a connection to the pod. Worth enabling whenever
# config.metricsPublic is true. Requires a CNI that enforces NetworkPolicy —
# on GKE that means Dataplane V2 or Calico; without one this renders but does
# nothing, which is a false sense of security.
networkPolicy:
  enabled: false
  # Namespaces allowed to reach the API port. Empty allows all namespaces.
  allowedNamespaces: []
    # - name: ingress-nginx
    # - name: monitoring

# ── Server configuration ──────────────────────────────────────────────────────
config:
  # Comma-separated browser origins allowed to call the API. Empty denies all
  # cross-origin requests; "*" allows any (not recommended with client-side keys).
  corsOrigins: ""
  port: 8080
  logFormat: ""          # set to "json" for production structured logging
  rustLog: "info"

  # Checkpoint after N rewards (0 = disabled)
  checkpointInterval: 5000
  # Checkpoint when WAL exceeds N MB (0 = disabled)
  maxWalSizeMb: 100

  maxFeatureDim: 4096
  maxArms: 1000
  rateLimitPerSec: 1000

  # "msgpack" for 3–5× smaller WAL (opt-in)
  walFormat: "json"

  # Path inside the container for audit log (empty = disabled)
  auditLog: ""

  # ── Resource bounds ─────────────────────────────────────────────────────────
  # Predictions awaiting a reward, roughly 1 KB each. This is the real memory
  # bound on the process: the TTL below does not cap it, so at 1,000 predictions
  # per second a 24-hour window would otherwise accumulate 86 million records.
  # Eviction permanently breaks reward matching, so alert on
  # banditdb_interactions_evicted_total.
  maxPendingInteractions: 100000

  # How long a prediction waits for its reward. Raise it for slow outcomes
  # (chargebacks, trials); rewards arriving later return 404 and are lost.
  # Raising this holds proportionally more in memory — size the cap above to match.
  rewardTtlSecs: 86400

  # Parquet shards kept per campaign; older ones are deleted at checkpoint.
  # 0 keeps everything, which grows until the volume fills and checkpointing
  # starts failing. Recovery never reads these — they are an export, not an archive.
  exportRetainShards: 50

  # Largest absolute value accepted in a context vector. Guards the rank-one
  # update: 1e155 is finite but squares to infinity, and the resulting NaN
  # persists through the checkpoint and survives restart.
  maxContextMagnitude: 1000000

  # Group-commit window for WAL fsync. Measured to make almost no difference
  # across a 20× range (the writer also syncs when it goes idle), so this is not
  # a useful tuning lever. Left here for completeness; leave it alone.
  fsyncIntervalMs: 200

  # ── Neural (only meaningful with the `neural` image) ────────────────────────
  # Background retrain cadence. 0 falls back to retraining only at checkpoint.
  retrainPollSecs: 2
  # Replay buffer entries per campaign: entries × context_dim × 8 bytes.
  neuralBufferCap: 50000
  # Minibatch per gradient step, so a large buffer does not slow every retrain.
  neuralBatchSize: 4000

# Deliberately not exposed as values:
#   BANDITDB_SKIP_DATA_DIR_LOCK      — disables single-writer enforcement
#   BANDITDB_ALLOW_CORRUPT_CHECKPOINT — boots from a checkpoint known to be bad
# Both trade away a safety net and belong in a break-glass shell, not in a
# values file where they can be set once and forgotten.
#   BANDITDB_DEVICE — GPU selection also needs nodeSelector, tolerations and
# GPU resource limits; exposing the variable alone would imply support that
# the chart does not yet provide.

# ── Compute resources ─────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# ── Health probes ─────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ── Pod configuration ─────────────────────────────────────────────────────────
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Autoscaling ───────────────────────────────────────────────────────────────
# BanditDB is single-writer: maxReplicas MUST stay at 1.
# HPA is provided for platform completeness and future read-replica support.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1  # Do not raise — no multi-writer support yet
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# ── Pod Disruption Budget ─────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: false
  minAvailable: 1
