{{- if .Values.networkPolicy.enabled }}
{{- /*
  Ingress-only policy. Egress is left unrestricted: the pod has no outbound
  dependencies, and an egress rule here would have to be widened again the
  moment anything is added.

  This matters most when config.metricsPublic is true. /metrics is then
  unauthenticated, and without a policy any pod in the cluster can read the
  campaign and arm names it exposes — in tenant mode, the customer list.

  Enforcement requires a CNI that implements NetworkPolicy. On GKE that means
  Dataplane V2 or Calico; on a cluster without one this object is accepted and
  ignored, which is worse than absent because it looks like protection.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "banditdb.fullname" . }}
  labels:
    {{- include "banditdb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "banditdb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.allowedNamespaces }}
      from:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .name }}
        {{- end }}
      {{- else }}
      # No `from` selector: every namespace may connect. Populate
      # networkPolicy.allowedNamespaces to restrict this.
      {{- end }}
{{- end }}
