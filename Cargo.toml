[package]
name = "banditdb"
version = "2.0.0"
edition = "2021"
description = "An ultra-fast Contextual Bandit Database"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://banditdb.com"
repository = "https://github.com/dynamicpricing-ai/banditdb"
documentation = "https://banditdb.com/docs/"

# ethnum 1.5.2, reached via polars, fails to compile on recent rustc — it
# transmutes () into an 8-bit TryFromIntError, which newer transmute size
# checking rejects. 1.5.3 fixes it. Declaring the floor here makes an
# unsupported toolchain a clear message rather than a confusing build error.
rust-version = "1.97"

# crates.io allows 5 of each.
keywords = ["bandit", "contextual-bandit", "reinforcement", "personalization", "linucb"]
categories = ["algorithms", "database-implementations", "science", "web-programming::http-server"]

# An allow-list rather than an exclude-list. The repo carries 156 MB of benchmark
# datasets that would blow past the registry limit, but blocklisting is the wrong
# tool: excluding `docs/` wholesale produced a crate that would not compile,
# because main.rs serves the OpenAPI spec via include_str!("../docs/openapi.yaml").
# Whitelisting makes that dependency explicit and fails loudly if it moves.
#
# `tests/` ships deliberately — it documents the concurrency and durability
# contracts better than prose does.
# Leading slashes matter: these are gitignore-style globs, so a bare "README.md"
# matches at every depth and quietly pulled in README files from benchmark/,
# deploy/ and a stray directory. Anchor everything to the package root.
include = [
    "/src/**/*.rs",
    "/tests/**/*.rs",
    "/docs/openapi.yaml",   # compiled into the binary; see main.rs
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Cargo.toml",
]

[dependencies]
ndarray = { version = "0.15", features = ["serde"] }
parking_lot = "0.12"
moka = { version = "0.12", features = ["sync"] }
uuid = { version = "1.8", features = ["v4"] }
axum = "0.7"
tokio = { version = "1.43", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http         = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
polars = { version = "0.41", features = ["json", "parquet", "lazy"] }
rand = "0.8"
rand_distr = "0.4"
subtle = "2"
governor = "0.6"
rmp-serde = "1"
candle-core = { version = "0.10", optional = true }
candle-nn = { version = "0.10", optional = true }

[features]
neural = ["dep:candle-core", "dep:candle-nn"]
cuda   = ["neural", "candle-core/cuda"]
metal  = ["neural", "candle-core/metal"]
